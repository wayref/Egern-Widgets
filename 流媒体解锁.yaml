name: "流媒体解锁"
description: "检测流媒体与 AI 服务解锁状态"
icon: "play.tv.fill"

env_schema:
  REFRESH_HOURS:
    name: 刷新间隔（小时）
    description: 小组件刷新间隔，0.5~24 小时
    default_value: "1"
  WIDGET_STYLE:
    name: 样式
    description: 纯黑背景：不透明黑底；毛玻璃纯黑：半透明黑底；毛玻璃透明：无背景，壁纸直接透出
    options:
      - 纯黑背景
      - 毛玻璃纯黑
      - 毛玻璃透明
    default_value: "纯黑背景"
  POLICY_YOUTUBE:
    name: YouTube 测试节点
    description: YouTube 用哪个策略组或节点测试，填策略组名如香港智能优选或节点名，留空用默认
    default_value: ""
  POLICY_NETFLIX:
    name: Netflix 测试节点
    description: Netflix 用哪个策略组或节点测试，填策略组名如美国智能优选或节点名，留空用默认
    default_value: ""
  POLICY_TIKTOK:
    name: TikTok 测试节点
    description: TikTok 用哪个策略组或节点测试，填策略组名或节点名，留空用默认
    default_value: ""
  POLICY_SPOTIFY:
    name: Spotify 测试节点
    description: Spotify 用哪个策略组或节点测试，填策略组名或节点名，留空用默认
    default_value: ""
  POLICY_CHATGPT:
    name: ChatGPT 测试节点
    description: ChatGPT 用哪个策略组或节点测试，填策略组名或节点名，留空用默认
    default_value: ""
  POLICY_CLAUDE:
    name: Claude 测试节点
    description: Claude 用哪个策略组或节点测试，填策略组名或节点名，留空用默认
    default_value: ""
  POLICY_GEMINI:
    name: Gemini 测试节点
    description: Gemini 用哪个策略组或节点测试，填策略组名或节点名，留空用默认
    default_value: ""
  POLICY_GROK:
    name: Grok 测试节点
    description: Grok 用哪个策略组或节点测试，填策略组名或节点名，留空用默认
    default_value: ""
scriptings:
  - generic:
      name: "流媒体解锁"
      script_url: "https://raw.githubusercontent.com/wayref/Egern-Widgets/main/流媒体解锁-模块版.js"
      timeout: 30

widgets:
  - name: "流媒体解锁"
