name: "流媒体解锁"
description: "检测流媒体与 AI 服务解锁状态"
icon: "play.tv.fill"

env_schema:
  REFRESH_HOURS:
    name: 刷新间隔（小时）
    description: 小组件刷新间隔，0.5~24 小时
    default_value: "1"
  WIDGET_STYLE:
    name: 样式
    description: 纯黑背景：不透明黑底；毛玻璃纯黑：半透明黑底；毛玻璃透明：无背景，壁纸直接透出
    options:
      - 纯黑背景
      - 毛玻璃纯黑
      - 毛玻璃透明
    default_value: "纯黑背景"
  TEST_YOUTUBE:
    name: 测试 YouTube
    description: 是否测试 YouTube 解锁状态
    options:
      - 开启
      - 关闭
    default_value: "开启"
  TEST_NETFLIX:
    name: 测试 Netflix
    description: 是否测试 Netflix 解锁状态
    options:
      - 开启
      - 关闭
    default_value: "开启"
  TEST_TIKTOK:
    name: 测试 TikTok
    description: 是否测试 TikTok 解锁状态
    options:
      - 开启
      - 关闭
    default_value: "开启"
  TEST_SPOTIFY:
    name: 测试 Spotify
    description: 是否测试 Spotify 解锁状态
    options:
      - 开启
      - 关闭
    default_value: "开启"
  TEST_CHATGPT:
    name: 测试 ChatGPT
    description: 是否测试 ChatGPT 解锁状态
    options:
      - 开启
      - 关闭
    default_value: "开启"
  TEST_CLAUDE:
    name: 测试 Claude
    description: 是否测试 Claude 解锁状态
    options:
      - 开启
      - 关闭
    default_value: "开启"
  TEST_GEMINI:
    name: 测试 Gemini
    description: 是否测试 Gemini 解锁状态
    options:
      - 开启
      - 关闭
    default_value: "开启"
  TEST_GROK:
    name: 测试 Grok
    description: 是否测试 Grok 解锁状态
    options:
      - 开启
      - 关闭
    default_value: "开启"
scriptings:
  - generic:
      name: "流媒体解锁"
      script_url: "https://raw.githubusercontent.com/wayref/Egern-Widgets/main/流媒体解锁-模块版.js"
      timeout: 30

widgets:
  - name: "流媒体解锁"
