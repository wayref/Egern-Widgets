name: "机场订阅"
description: "机场订阅流量监控：最多 5 个机场，剩余流量、已用/总量、到期时间，支持小/中/大尺寸"
icon: "chart.pie.fill"

env_schema:
  NAME1:
    name: 机场1名称
    description: 显示在卡片上的机场名称
    default_value: ''
  URL1:
    name: 机场1订阅地址
    description: 从机场后台复制的完整订阅链接（含 token）
    default_value: ''
  NAME2:
    name: 机场2名称
    description: 显示在卡片上的机场名称
    default_value: ''
  URL2:
    name: 机场2订阅地址
    description: 从机场后台复制的完整订阅链接（含 token）
    default_value: ''
  NAME3:
    name: 机场3名称
    description: 显示在卡片上的机场名称
    default_value: ''
  URL3:
    name: 机场3订阅地址
    description: 从机场后台复制的完整订阅链接（含 token）
    default_value: ''
  NAME4:
    name: 机场4名称
    description: 显示在卡片上的机场名称
    default_value: ''
  URL4:
    name: 机场4订阅地址
    description: 从机场后台复制的完整订阅链接（含 token）
    default_value: ''
  NAME5:
    name: 机场5名称
    description: 显示在卡片上的机场名称
    default_value: ''
  URL5:
    name: 机场5订阅地址
    description: 从机场后台复制的完整订阅链接（含 token）
    default_value: ''
  REFRESH_HOURS:
    name: 刷新间隔（小时）
    description: 小组件刷新间隔，0.5~24 小时
    default_value: "2"
  WIDGET_STYLE:
    name: 样式
    description: 纯黑背景：不透明黑底；毛玻璃纯黑：半透明黑底；毛玻璃透明：无背景，壁纸直接透出
    options:
      - 纯黑背景
      - 毛玻璃纯黑
      - 毛玻璃透明
    default_value: "纯黑背景"
scriptings:
  - generic:
      name: "机场订阅"
      script_url: "https://cdn.jsdelivr.net/gh/wayref/Egern-Widgets@main/机场订阅-模块版.js"
      timeout: 60

widgets:
  - name: "机场订阅"
