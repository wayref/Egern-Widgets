name: "IP检测"
description: "IP 检测：IP/归属地/国旗/VPN·代理状态/原生·家宽/风险评分，小号方块"
icon: "globe"

env_schema:
  WIDGET_STYLE:
    name: 样式
    description: 纯黑背景：不透明黑底；毛玻璃纯黑：半透明黑底；毛玻璃透明：无背景，壁纸直接透出
    options:
      - 纯黑背景
      - 毛玻璃纯黑
      - 毛玻璃透明
    default_value: "纯黑背景"

scriptings:
  - generic:
      name: "IP检测"
      script_url: "https://cdn.jsdelivr.net/gh/wayref/Egern-Widgets@main/IP检测-模块版.js"
      timeout: 20

widgets:
  - name: "IP检测"
