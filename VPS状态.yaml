name: "VPS状态"
description: "qt-1 服务器状态监控，通过 HTTP 接口显示 CPU、内存、硬盘、运行时间、在线人数"
icon: "server.rack"

env_schema:
  API_URL:
    name: 接口地址
    description: 服务器状态接口地址
    default_value: "https://qingtianzhuce.ccwu.cc/api/stats"
  WIDGET_STYLE:
    name: 样式
    description: 纯黑背景：不透明黑底；毛玻璃纯黑：半透明黑底；毛玻璃透明：无背景，壁纸直接透出
    options:
      - 纯黑背景
      - 毛玻璃纯黑
      - 毛玻璃透明
    default_value: "纯黑背景"

scriptings:
  - generic:
      name: "VPS状态"
      script_url: "https://raw.githubusercontent.com/wayref/Egern-Widgets/main/VPS状态.js"
      timeout: 20

widgets:
  - name: "VPS状态"
