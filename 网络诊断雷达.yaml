name: "网络诊断雷达"
description: "网络诊断雷达：本地网络与代理出口双栏诊断"
icon: "waveform.path.ecg"

env_schema:
  WIDGET_STYLE:
    name: 样式
    description: 纯黑背景：不透明黑底；毛玻璃纯黑：半透明黑底；毛玻璃透明：无背景，壁纸直接透出
    options:
      - 纯黑背景
      - 毛玻璃纯黑
      - 毛玻璃透明
    default_value: "纯黑背景"
  POLICY_EXIT:
    name: 出口检测节点
    description: 出口用哪个策略组或节点检测，填策略组名如香港智能优选或节点名，留空用默认
    default_value: ""

scriptings:
  - generic:
      name: "网络诊断雷达"
      script_url: "https://raw.githubusercontent.com/wayref/Egern-Widgets/main/网络诊断雷达-模块版.js"
      timeout: 20

widgets:
  - name: "网络诊断雷达"
